<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assessment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">AI Career Mentor</a>

<div class="navbar-nav ms-auto">

<a class="nav-link" href="/">Home</a>
<a class="nav-link active" href="/assessment">Career Assessment</a>
<a class="nav-link" href="/result">Recommendation Result</a>
<a class="nav-link" href="/about">About</a>

</div>

</div>

</nav>

<!-- Assessment Form -->

<div class="container mt-5">

<h2 class="text-center mb-4">
Career Assessment
</h2>

<form action="/result" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">College Name</label>
<input type="text" class="form-control" name="college" required>
</div>

</div>

<div class="row">

<div class="col-md-4 mb-3">
<label class="form-label">Degree</label>
<select class="form-select" name="degree" required>
<option value="">Select Degree</option>
<option>B.Tech</option>
<option>BCA</option>
<option>B.Sc</option>
<option>MCA</option>
<option>M.Tech</option>
<option>MBA</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Course</label>
<input type="text" class="form-control" name="course" placeholder="AI & ML" required>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Current Year</label>
<select class="form-select" name="year" required>
<option value="">Select Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">CGPA</label>
<input type="number" step="0.01" min="0" max="10" class="form-control" name="cgpa" placeholder="Enter CGPA" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Skills</label>
<input type="text" class="form-control" name="skills" placeholder="Python, SQL, Machine Learning" required>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Interested Area</label>
<select class="form-select" name="interest" required>
<option value="">Select Area</option>
<option>Artificial Intelligence</option>
<option>Machine Learning</option>
<option>Data Science</option>
<option>Software Development</option>
<option>Cyber Security</option>
<option>Cloud Computing</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Looking For</label>
<select class="form-select" name="job_type" required>
<option value="">Select Option</option>
<option value="Job">Job</option>
<option value="Internship">Internship</option>
</select>
</div>

</div>

<div class="text-center mt-4">

<button type="submit" class="btn btn-primary">
Find Recommendations
</button>

</div>

</form>

</div>

</body>
</html>
